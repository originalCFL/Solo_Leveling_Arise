<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="獵人系統">
<meta name="theme-color" content="#04060d">
<title>獵人系統：習慣升級</title>
<style>
:root{--bg:#04060d;--panel:rgba(9,18,44,.78);--line:#2a62e6;--glow:#4da3ff;--text:#d6e4ff;--dim:#7e93bf;--violet:#9a5cff;--red:#ff4466;--gold:#ffc857;--green:#3ee0a0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0f2250 0,transparent 60%),var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h1,h2,h3{margin:0;font-weight:700}
.win{position:relative;background:var(--panel);border:1px solid var(--line);box-shadow:0 0 18px rgba(42,98,230,.35),inset 0 0 22px rgba(42,98,230,.12);padding:14px;margin-bottom:12px;backdrop-filter:blur(3px)}
.win::before,.win::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--glow)}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.ttl{color:var(--glow);font-size:13px;letter-spacing:.12em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.hero{display:flex;gap:14px;align-items:center}
.lv{font-size:64px;font-weight:800;line-height:1;color:#fff;text-shadow:0 0 14px var(--glow),0 0 32px var(--line)}
.lvl{font-size:12px;color:var(--dim)}
.rank{display:inline-block;border:1px solid var(--violet);color:var(--violet);padding:1px 8px;font-size:12px;margin-top:4px}
.nm{background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--text);font:inherit;font-size:18px;font-weight:700;width:100%;padding:2px 0}
.bar{height:9px;background:#0a1330;border:1px solid #1d3a86;position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f4fe0,var(--glow));box-shadow:0 0 10px var(--glow);transition:width .5s}
.bar.hp i{background:linear-gradient(90deg,#c21f45,var(--red))}
.bar.gd i{background:linear-gradient(90deg,#7a4be0,var(--violet))}
.row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:8px 0 3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.st{font-size:13px}.st b{float:right;color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(4,8,20,.95);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:13px;padding:13px 4px;cursor:pointer}
.tabs button.on{color:#fff;text-shadow:0 0 10px var(--glow);box-shadow:inset 0 2px 0 var(--glow)}
.q{border:1px solid #1d3a86;padding:10px 12px;margin-bottom:10px;background:rgba(5,12,32,.6)}
.q.bad{border-color:#6b2038}
.q.done{opacity:.6}
.qh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.qn{font-weight:700}
.tag{font-size:11px;color:var(--glow);border:1px solid #1d3a86;padding:0 6px;margin-left:6px;white-space:nowrap}
.bad .tag{color:var(--red);border-color:#6b2038}
.sub{font-size:12px;color:var(--dim);margin:6px 0 4px}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button.b{background:rgba(42,98,230,.18);border:1px solid var(--glow);color:#fff;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
button.b:hover{background:rgba(77,163,255,.35)}
button.b:disabled{opacity:.4;cursor:default}
button.b.r{border-color:var(--red);background:rgba(255,68,102,.14)}
button.b.g{border-color:var(--gold);background:rgba(255,200,87,.14);color:var(--gold)}
button.b.x{border-color:#334;color:var(--dim);background:none;margin-left:auto}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.add{width:100%;padding:12px;margin-bottom:12px}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:18px 6px}
.sh{display:flex;gap:12px;align-items:center;border:1px solid #3b2a73;background:linear-gradient(90deg,rgba(154,92,255,.16),transparent);padding:10px 12px;margin-bottom:10px}
.sh .em{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--violet);color:var(--violet);font-weight:800;box-shadow:0 0 14px rgba(154,92,255,.6);flex:none}
.ov{position:fixed;inset:0;z-index:20;background:rgba(2,4,12,.9);display:grid;place-items:center;padding:20px}
.ov .win{width:100%;max-width:420px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.big{font-size:44px;font-weight:800;color:#fff;text-shadow:0 0 12px var(--glow),0 0 40px var(--line);margin:6px 0}
.arise .big{text-shadow:0 0 12px var(--violet),0 0 40px #5a2bd0}
.arise.win{border-color:var(--violet);box-shadow:0 0 30px rgba(154,92,255,.5),inset 0 0 30px rgba(154,92,255,.2)}
.flash{position:fixed;inset:0;z-index:19;pointer-events:none;background:radial-gradient(circle,#9cd0ff,transparent 60%);animation:fl .9s forwards}
.glitch{animation:gl 2.2s steps(1) infinite}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes fl{from{opacity:.9}to{opacity:0}}
@keyframes gl{0%,92%,100%{transform:none}93%{transform:translate(-3px,1px);color:var(--glow)}95%{transform:translate(3px,-1px);color:var(--violet)}97%{transform:none}}
@media (prefers-reduced-motion:reduce){.ov .win,.flash,.glitch{animation:none}.bar i{transition:none}}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
#toast div{background:rgba(6,14,38,.96);border:1px solid var(--glow);padding:8px 12px;font-size:13px;box-shadow:0 0 14px rgba(77,163,255,.5)}
#toast .bad{border-color:var(--red);box-shadow:0 0 14px rgba(255,68,102,.4)}
label{display:block;text-align:left;font-size:12px;color:var(--dim);margin:10px 0 4px}
input,select{width:100%;background:#050c20;border:1px solid var(--line);color:var(--text);padding:9px;font:inherit;font-size:16px}
.seg{display:flex;gap:8px}.seg button{flex:1}
.seg button.sel{background:rgba(77,163,255,.4)}
.cd{font-size:12px}.opt{display:block;width:100%;margin-bottom:8px;text-align:left;padding:11px 14px}.opt.sel{background:rgba(77,163,255,.45);box-shadow:0 0 10px var(--glow)}
html{background:#04060d}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}textarea{width:100%;height:150px;background:#050c20;border:1px solid var(--line);color:var(--text);padding:9px;font:inherit;font-size:16px;resize:none}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>
<div id="ov"></div>
<nav class="tabs" id="tabs"></nav>
<script>
var KEY='hunter-system-v1';
var STATS={STR:'體能',INT:'智力',VIT:'健康',SEN:'心靈',AGI:'效率'};
var S=null,tab='status',ovq=[],confirmId=null;
function z(n){return String(n).padStart(2,'0')}
function ds(d){d=d||new Date();return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
var T=ds(),Y=ds(new Date(Date.now()-864e5));
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function need(l){return 100+(l-1)*50}
function rankOf(l){return l>=30?'S':l>=20?'A':l>=15?'B':l>=10?'C':l>=5?'D':'E'}
function fresh(){return{name:'玩家',lv:1,xp:0,hp:100,day:T,stats:{STR:0,INT:0,VIT:0,SEN:0,AGI:0},habits:[],rewards:[]}}
function load(){try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):fresh()}catch(e){S=fresh()}
 if(!S||!S.habits)S=fresh();
 if(S.init===undefined)S.init=S.habits.length>0;
 rollover();if(!S.init&&!S.habits.length)ovq.push({k:'quiz'})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function daysDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function rollover(){var L=[],hp=0,xp=0;
 S.habits.forEach(function(h){if(h.last&&h.last<Y)h.streak=0;
  if(S.hard&&h.type==='good'){var b=h.last||h.start||S.day;if(h.pen&&h.pen>b)b=h.pen;
   var m=Math.min(3,Math.max(0,daysDiff(b,Y)));if(m>0){hp+=10*m;xp+=Math.ceil(h.xp/2)*m;L.push(h.name+'：漏做 '+m+' 天')}}
  h.pen=Y});
 if(S.day!==T)S.hp=Math.min(100,S.hp+10);
 S.day=T;
 if(hp){S.hp-=hp;S.xp=Math.max(0,S.xp-xp);if(S.hp<=0){S.hp=50;S.xp=0;L.push('瀕死：本級經驗歸零，HP 回復至 50')}ovq.push({k:'pen',L:L,hp:hp,xp:xp})}
 save()}
function tick(){if(ds()!==T){T=ds();Y=ds(new Date(Date.now()-864e5));rollover();render();flush();return}updateCd()}
function nOpen(){return S.habits.filter(function(h){return !done(h)&&h.type==='good'}).length}
function updateCd(){var n=new Date(),e=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.floor((e-n)/1000),t=z(Math.floor(s/3600))+':'+z(Math.floor(s%3600/60))+':'+z(s%60),op=nOpen();
 document.querySelectorAll('.cd').forEach(function(x){x.textContent='距離截止 '+t;x.style.color=(s<10800&&op)?'var(--red)':'var(--glow)'})}
function cdBox(){return'<div class="win"><div class="ttl"><span>[ 今日截止 ]</span><span class="cd"></span></div><div class="sub" style="margin:0">尚有 '+nOpen()+' 項好習慣未完成。'+(S.hard?'困難模式：漏做會自動扣 HP 與 XP。':'午夜過後未完成，連續天數會中斷。')+'</div></div>'}
function modeBox(){return'<div class="win"><div class="ttl"><span>[ 難度模式 ]</span></div><div class="sub" style="margin:0 0 8px">'+(S.hard?'困難模式：好習慣每漏做一天，自動扣 10 HP 與該任務一半 XP（一次最多結算 3 天）。':'一般模式：漏做只會中斷連續天數。')+'</div><div class="btns"><button class="b '+(S.hard?'r':'')+'" onclick="toggleHard()">切換為'+(S.hard?'一般':'困難')+'模式</button><button class="b" onclick="startQuiz()">重新做覺醒測驗</button></div><div class="btns"><button class="b" onclick="exportData()">匯出備份</button><button class="b" onclick="importData()">匯入備份</button></div></div>'}
function toggleHard(){S.hard=!S.hard;S.habits.forEach(function(h){h.pen=Y});save();render();toast('[系統] 已切換為'+(S.hard?'困難':'一般')+'模式',S.hard)}
var QS=[{q:'你的作息比較接近？',o:['早起型（早睡早起）','夜貓型（晚睡晚起）']},{q:'最想提升哪些領域？（最多選 2 項）',m:1,o:['體能','智力','健康','心靈','效率']},{q:'每天最多能投入多少時間？',o:['15 分鐘','30 分鐘','60 分鐘以上']},{q:'想戒除哪一個壞習慣？',o:['滑短影音','熬夜','含糖飲料','暫時不設']},{q:'選擇難度模式',o:['一般模式（漏做只中斷連續）','困難模式（漏做自動受罰）']}];
var QZ=null;
function startQuiz(){QZ={i:0,a:[],sel:[]};qz()}
function qz(){var q=QS[QZ.i];$('#ov').innerHTML='<div class="ov"><div class="win" style="max-height:92vh;overflow:auto"><div class="ttl"><span>[ 覺醒測驗 '+(QZ.i+1)+'／'+QS.length+' ]</span></div><div style="font-weight:700;margin-bottom:10px;text-align:left">'+q.q+'</div>'+q.o.map(function(t,k){return'<button class="b opt'+(QZ.sel.indexOf(k)>-1?' sel':'')+'" onclick="pick('+k+')">'+t+'</button>'}).join('')+(q.m?'<div class="btns" style="justify-content:center"><button class="b g" onclick="nextQ()">下一題</button></div>':'')+'<div class="btns" style="justify-content:center"><button class="b x" style="margin-left:0" onclick="skipQ()">略過測驗</button></div></div></div>'}
function pick(k){var q=QS[QZ.i];if(q.m){var p=QZ.sel.indexOf(k);if(p>-1)QZ.sel.splice(p,1);else if(QZ.sel.length<2)QZ.sel.push(k);qz()}else{QZ.a.push([k]);QZ.i++;QZ.sel=[];if(QZ.i<QS.length)qz();else finishQ()}}
function nextQ(){if(!QZ.sel.length){toast('請至少選 1 項',true);return}QZ.a.push(QZ.sel.slice());QZ.i++;QZ.sel=[];if(QZ.i<QS.length)qz();else finishQ()}
function skipQ(){S.init=true;save();closeOv()}
function finishQ(){var a=QZ.a,ST=['STR','INT','VIT','SEN','AGI'],foc=a[1].map(function(k){return ST[k]}),i3=a[2][0],m=[10,20,30][i3],cnt=[3,4,5][i3],xp=[10,20,30][i3],early=a[0][0]===0,
 order=foc.concat(['VIT','STR','INT','SEN','AGI'].filter(function(k){return foc.indexOf(k)<0})).slice(0,cnt),
 NM={STR:'運動 '+m+' 分鐘',INT:'閱讀 '+m+' 分鐘',VIT:early?'早起（7:00 前起床）':'早睡（00:00 前就寢）',SEN:'冥想 10 分鐘',AGI:'整理今日待辦'},
 bad=[['不滑短影音','SEN'],['不熬夜','VIT'],['不喝含糖飲料','VIT']][a[3][0]],list=[],t=Date.now(),names=[];
 order.forEach(function(k,j){list.push({id:'h'+t+j,name:NM[k],type:'good',stat:k,xp:xp,goal:(k==='SEN'||k==='AGI')?14:21})});
 if(bad)list.push({id:'h'+t+'b',name:bad[0],type:'bad',stat:bad[1],xp:20,goal:14});
 list.forEach(function(h){if(S.habits.some(function(x){return x.name===h.name}))return;h.streak=0;h.total=0;h.last=null;h.shadow=false;h.start=T;h.pen=Y;S.habits.push(h);names.push(h.name)});
 foc.forEach(function(k){S.stats[k]+=2});S.hard=a[4][0]===1;S.init=true;save();
 $('#ov').innerHTML='<div class="ov"><div class="win"><div class="ttl" style="justify-content:center">[ 覺醒完成 ]</div><div class="big" style="font-size:30px">任務已生成</div><div style="text-align:left;font-size:14px">'+(names.length?names.map(function(t){return'<div>'+esc(t)+'</div>'}).join(''):'沒有新增任務（已有同名任務）')+'</div><div class="sub">所選領域能力值 +2　'+(S.hard?'困難模式':'一般模式')+'</div><div class="btns" style="justify-content:center"><button class="b" onclick="closeOv()">開始</button></div></div></div>'}
function exportData(){var j=JSON.stringify(S);$('#ov').innerHTML='<div class="ov"><div class="win"><div class="ttl">[ 匯出備份 ]</div><div class="sub" style="margin:0 0 8px;text-align:left">複製這段文字，貼到備忘錄或傳給自己保存。換裝置或重裝時用「匯入備份」還原。</div><textarea id="bk" readonly>'+esc(j)+'</textarea><div class="btns" style="justify-content:center"><button class="b" onclick="copyBk()">複製</button><button class="b" id="shb" onclick="shareBk()">分享</button><button class="b x" style="margin-left:0" onclick="closeOv()">關閉</button></div></div></div>';if(!navigator.share)$('#shb').style.display='none'}
function copyBk(){var t=$('#bk');t.focus();t.select();t.setSelectionRange(0,t.value.length);var ok=false;try{ok=document.execCommand('copy')}catch(e){}
 if(navigator.clipboard&&!ok){navigator.clipboard.writeText(t.value).then(function(){toast('[系統] 已複製備份')},function(){toast('請長按文字手動複製',true)});return}
 toast(ok?'[系統] 已複製備份':'請長按文字手動複製',!ok)}
function shareBk(){try{navigator.share({title:'獵人系統備份',text:$('#bk').value})}catch(e){}}
function importData(){$('#ov').innerHTML='<div class="ov"><div class="win"><div class="ttl">[ 匯入備份 ]</div><div class="sub" style="margin:0 0 8px;text-align:left">貼上先前匯出的備份文字。匯入會覆蓋目前的所有進度。</div><textarea id="bk" placeholder="貼上備份文字"></textarea><div class="btns" style="justify-content:center"><button class="b r" onclick="doImport()">匯入並覆蓋</button><button class="b x" style="margin-left:0" onclick="closeOv()">取消</button></div></div></div>'}
function doImport(){var o;try{o=JSON.parse($('#bk').value.trim())}catch(e){toast('格式不正確，請完整貼上備份文字',true);return}
 if(!o||!Array.isArray(o.habits)||!o.stats||typeof o.lv!=='number'){toast('這不是有效的備份',true);return}
 S=o;S.init=true;rollover();save();closeOv();toast('[系統] 備份已還原')}
function toast(m,bad){var d=document.createElement('div');d.textContent=m;if(bad)d.className='bad';$('#toast').appendChild(d);setTimeout(function(){d.remove()},2600)}
function $(s){return document.querySelector(s)}
function shadows(){return S.habits.filter(function(h){return h.shadow})}
function mult(){return Math.min(2,1+0.1*shadows().length)}
function gain(x){x=Math.round(x*mult());S.xp+=x;
 while(S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;S.hp=100;ovq.push({k:'level',lv:S.lv})}return x}
function sRank(h){var r=h.total/h.goal;return r>=5?['將','暗影將軍']:r>=3?['精','暗影精英']:r>=2?['騎','暗影騎士']:['兵','暗影士兵']}
function done(h){return h.last===T}
function complete(id){var h=S.habits.find(function(x){return x.id===id});if(!h||done(h))return;
 h.streak++;h.total++;h.last=T;S.stats[h.stat]++;var g=gain(h.xp);
 toast('[系統] '+(h.type==='bad'?'成功忍住':'任務完成')+'：'+h.name+'　+'+g+' XP');
 if(h.streak>=h.goal&&!h.shadow)ovq.push({k:'arise',id:h.id});
 save();render();flush()}
function slip(id){var h=S.habits.find(function(x){return x.id===id});if(!h)return;
 h.streak=0;h.last=null;S.hp-=15;S.xp=Math.max(0,S.xp-h.xp);
 toast('[系統] 破戒：'+h.name+'　HP -15　XP -'+h.xp,true);
 if(S.hp<=0){S.hp=50;S.xp=0;toast('[系統] 瀕死！本級經驗歸零，HP 回復至 50',true)}
 save();render()}
function del(id){if(confirmId!==id){confirmId=id;render();return}
 S.habits=S.habits.filter(function(x){return x.id!==id});confirmId=null;save();render()}
function flush(){if($('#ov').innerHTML||!ovq.length)return;var o=ovq.shift(),h;
 if(o.k==='quiz'){startQuiz();return}
 if(o.k==='pen'){$('#ov').innerHTML='<div class="flash" style="background:radial-gradient(circle,#ff5a78,transparent 60%)"></div><div class="ov"><div class="win" style="border-color:var(--red)"><div class="ttl" style="justify-content:center;color:var(--red)">[ 懲罰通知 ]</div><div class="big glitch" style="font-size:36px">PENALTY</div><div class="sub">困難模式：未完成的任務已自動結算</div><div style="text-align:left;font-size:14px">'+o.L.map(function(t){return'<div>'+esc(t)+'</div>'}).join('')+'</div><div class="sub">HP -'+o.hp+'　XP -'+o.xp+'</div><div class="btns" style="justify-content:center"><button class="b r" onclick="closeOv()">確認</button></div></div></div>';return}
 if(o.k==='level'){$('#ov').innerHTML='<div class="flash"></div><div class="ov"><div class="win"><div class="ttl" style="justify-content:center">[ 系統通知 ]</div><div class="big glitch">LEVEL UP</div><div style="font-size:15px">等級提升至 <b style="color:#fff;font-size:24px">Lv.'+o.lv+'</b> ／ 階級 '+rankOf(o.lv)+'</div><div class="sub">HP 已完全回復。可前往「獎勵」查看已解鎖的獎勵。</div><div class="btns" style="justify-content:center"><button class="b" onclick="closeOv()">確認</button></div></div></div>'}
 else{h=S.habits.find(function(x){return x.id===o.id});if(!h){closeOv();return}
  $('#ov').innerHTML='<div class="flash" style="background:radial-gradient(circle,#b48cff,transparent 60%)"></div><div class="ov arise"><div class="win arise"><div class="ttl" style="justify-content:center;color:var(--violet)">[ 目標達成 ]</div><div class="big glitch">ARISE</div><div style="font-size:15px">「'+esc(h.name)+'」已連續 '+h.streak+' 天，<br>可收為你的暗影士兵。</div><div class="sub">暗影越多，所有 XP 加成越高（上限 2 倍）。收編另獲 '+(h.goal*5)+' XP。</div><div class="btns" style="justify-content:center"><button class="b g" onclick="arise(\''+h.id+'\')">起身</button></div></div></div>'}}
function arise(id){var h=S.habits.find(function(x){return x.id===id});h.shadow=true;var g=gain(h.goal*5);
 toast('[系統] 暗影收編：'+h.name+'　+'+g+' XP');save();closeOv();render()}
function closeOv(){$('#ov').innerHTML='';render();flush()}
function openAdd(){$('#ov').innerHTML='<div class="ov"><div class="win" style="max-height:92vh;overflow:auto"><div class="ttl">[ 新增任務 ]</div><label>任務名稱</label><input id="fn" maxlength="30" placeholder="例如：每天運動 30 分鐘"><label>類型</label><div class="seg"><button class="b sel" id="tg" onclick="setT(\'good\')">好習慣（養成）</button><button class="b" id="tb" onclick="setT(\'bad\')">壞習慣（戒除）</button></div><label>強化屬性</label><select id="fs">'+Object.keys(STATS).map(function(k){return'<option value="'+k+'">'+STATS[k]+'</option>'}).join('')+'</select><label>每次完成的 XP</label><select id="fx"><option>10</option><option selected>20</option><option>30</option><option>50</option></select><label>目標天數（連續達成後可收為暗影）</label><input id="fg" type="number" min="3" max="365" value="21"><div class="btns" style="justify-content:center;margin-top:16px"><button class="b" onclick="addH()">建立任務</button><button class="b x" style="margin-left:0" onclick="closeOv()">取消</button></div></div></div>';window._t='good'}
function setT(t){window._t=t;$('#tg').className='b'+(t==='good'?' sel':'');$('#tb').className='b'+(t==='bad'?' sel':'')}
function addH(){var n=$('#fn').value.trim();if(!n){toast('請輸入任務名稱',true);return}
 S.habits.push({id:'h'+Date.now(),name:n,type:window._t,stat:$('#fs').value,xp:+$('#fx').value,goal:Math.max(3,Math.min(365,+$('#fg').value||21)),streak:0,total:0,last:null,shadow:false,start:T,pen:Y});
 save();closeOv()}
function starter(){[['早睡（23:00 前就寢）','good','VIT',20,21],['運動 30 分鐘','good','STR',30,21],['閱讀 20 分鐘','good','INT',20,21],['冥想 10 分鐘','good','SEN',10,14],['整理今日待辦','good','AGI',10,14],['不滑短影音','bad','SEN',30,14]].forEach(function(a,i){S.habits.push({id:'h'+Date.now()+i,name:a[0],type:a[1],stat:a[2],xp:a[3],goal:a[4],streak:0,total:0,last:null,shadow:false})});save();render()}
function addR(){var n=$('#rn').value.trim(),l=+$('#rl').value;if(!n||!l){toast('請填寫獎勵與所需等級',true);return}
 S.rewards.push({id:'r'+Date.now(),name:n,lv:l,claimed:false});save();render()}
function claim(id){var r=S.rewards.find(function(x){return x.id===id});r.claimed=true;toast('[系統] 已領取獎勵：'+r.name);save();render()}
function delR(id){S.rewards=S.rewards.filter(function(x){return x.id!==id});save();render()}
function setName(v){S.name=v.slice(0,12)||'玩家';save()}
function card(h){var p=Math.min(100,h.streak/h.goal*100),bad=h.type==='bad',d=done(h);
 return'<div class="q '+(bad?'bad ':'')+(d?'done':'')+'"><div class="qh"><div><span class="qn">'+esc(h.name)+'</span><span class="tag">'+STATS[h.stat]+' +1</span>'+(h.shadow?'<span class="tag" style="color:var(--violet);border-color:var(--violet)">暗影</span>':'')+'</div><div style="font-size:13px;color:var(--gold);white-space:nowrap">+'+h.xp+' XP</div></div><div class="sub">連續 '+h.streak+' ／ 目標 '+h.goal+' 天　累計 '+h.total+' 次</div><div class="bar '+(h.shadow?'gd':'')+'"><i style="width:'+p+'%"></i></div><div class="btns"><button class="b" '+(d?'disabled':'')+' onclick="complete(\''+h.id+'\')">'+(d?'今日已完成':bad?'今天忍住了':'完成')+'</button>'+(bad?'<button class="b r" onclick="slip(\''+h.id+'\')">破戒了</button>':'')+'<button class="b x" onclick="del(\''+h.id+'\')">'+(confirmId===h.id?'確定刪除？':'刪除')+'</button></div></div>'}
function render(){
 var tabs=[['status','狀態'],['quests','任務'],['army','暗影軍團'],['shop','獎勵']];
 $('#tabs').innerHTML=tabs.map(function(t){return'<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
 var h='',H=S.habits,dn=H.filter(done).length;
 if(tab==='status'){
  h+='<div class="win"><div class="ttl"><span>[ 狀態視窗 ]</span><span>'+T+'</span></div><div class="hero"><div><div class="lv">'+S.lv+'</div><div class="lvl">等級</div></div><div style="flex:1"><input class="nm" value="'+esc(S.name)+'" onchange="setName(this.value)" aria-label="玩家名稱"><div class="rank">階級 '+rankOf(S.lv)+'</div></div></div><div class="row"><span>經驗值</span><span>'+S.xp+' ／ '+need(S.lv)+'</span></div><div class="bar"><i style="width:'+S.xp/need(S.lv)*100+'%"></i></div><div class="row"><span>生命值</span><span>'+S.hp+' ／ 100</span></div><div class="bar hp"><i style="width:'+S.hp+'%"></i></div></div>';
  h+='<div class="win"><div class="ttl">[ 能力值 ]</div><div class="stats">'+Object.keys(STATS).map(function(k){return'<div class="st">'+STATS[k]+'<b>'+S.stats[k]+'</b></div>'}).join('')+'</div></div>';
  h+='<div class="win"><div class="ttl"><span>[ 今日進度 ]</span><span class="cd"></span></div><div class="row" style="margin-top:0"><span>已完成任務</span><span>'+dn+' ／ '+H.length+'</span></div><div class="bar"><i style="width:'+(H.length?dn/H.length*100:0)+'%"></i></div><div class="sub">暗影士兵 '+shadows().length+' 名，XP 加成 ×'+mult().toFixed(1)+'</div></div>';
  h+=modeBox()}
 if(tab==='quests'){
  h+=cdBox();h+='<button class="b add" onclick="openAdd()">＋ 新增任務</button>';
  if(!H.length)h+='<div class="win empty">還沒有任務。新增你想養成或戒除的習慣，或先載入範例。<div class="btns" style="justify-content:center"><button class="b" onclick="starter()">載入範例任務</button></div></div>';
  var g=H.filter(function(x){return x.type==='good'}),b=H.filter(function(x){return x.type==='bad'});
  if(g.length)h+='<div class="win"><div class="ttl">[ 每日任務 ]</div>'+g.map(card).join('')+'</div>';
  if(b.length)h+='<div class="win" style="border-color:#7a2442"><div class="ttl" style="color:var(--red)">[ 戒除目標：敵人 ]</div>'+b.map(card).join('')+'</div>'}
 if(tab==='army'){
  var sh=shadows();
  h+='<div class="win arise" style="border-color:var(--violet)"><div class="ttl" style="color:var(--violet)">[ 暗影軍團 ]</div><div class="sub" style="margin:0">你是君主，每個達成目標的習慣都是你的暗影士兵。人數越多，所有 XP 加成越高。目前 ×'+mult().toFixed(1)+'。</div></div>';
  if(!sh.length)h+='<div class="empty">尚無暗影。讓任何習慣連續達成目標天數，就能將它收編。</div>';
  sh.forEach(function(x){var r=sRank(x);h+='<div class="sh"><div class="em">'+r[0]+'</div><div style="flex:1"><div class="qn">'+esc(x.name)+'</div><div class="sub" style="margin:2px 0 0">'+r[1]+'　連續 '+x.streak+' 天　累計 '+x.total+' 次</div></div></div>'});
  var cand=H.filter(function(x){return !x.shadow}).sort(function(a,b){return b.streak/b.goal-a.streak/a.goal}).slice(0,3);
  if(cand.length){h+='<div class="win"><div class="ttl">[ 候補 ]</div>'+cand.map(function(x){return'<div style="margin-bottom:10px"><div class="row" style="margin:0 0 3px"><span style="color:var(--text)">'+esc(x.name)+'</span><span>還差 '+Math.max(0,x.goal-x.streak)+' 天</span></div><div class="bar gd"><i style="width:'+Math.min(100,x.streak/x.goal*100)+'%"></i></div></div>'}).join('')+'</div>'}}
 if(tab==='shop'){
  h+='<div class="win"><div class="ttl">[ 設定獎勵 ]</div><label>獎勵內容</label><input id="rn" maxlength="30" placeholder="例如：一頓大餐"><label>達到等級</label><input id="rl" type="number" min="2" max="99" value="'+(S.lv+1)+'"><div class="btns"><button class="b" onclick="addR()">加入獎勵</button></div></div>';
  if(!S.rewards.length)h+='<div class="empty">替自己設定升級獎勵，等級到了就能領取。</div>';
  S.rewards.slice().sort(function(a,b){return a.lv-b.lv}).forEach(function(r){var ok=S.lv>=r.lv;
   h+='<div class="q" style="'+(r.claimed?'opacity:.5':'')+'"><div class="qh"><span class="qn">'+esc(r.name)+'</span><span class="tag">Lv.'+r.lv+'</span></div><div class="btns"><button class="b g" '+(!ok||r.claimed?'disabled':'')+' onclick="claim(\''+r.id+'\')">'+(r.claimed?'已領取':ok?'領取':'尚未解鎖')+'</button><button class="b x" onclick="delR(\''+r.id+'\')">刪除</button></div></div>'})}
 $('#app').innerHTML=h;updateCd()}
function go(t){tab=t;confirmId=null;render();window.scrollTo(0,0)}
load();render();flush();setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
try{if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
</body>
</html>
