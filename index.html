<style>

.q{border:1px solid #1d3a86;padding:10px 12px;margin-bottom:10px;background:rgba(5,12,32,.6)}
.q.bad{border-color:#6b2038}

.qh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.qn{font-weight:700}

button.b.x{border-color:#334;color:var(--dim);background:none;margin-left:auto}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.add{width:100%;padding:12px;margin-bottom:12px}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:18px 6px}
.sh{display:flex;gap:12px;align-items:center;border:1px solid #3b2a73;background:linear-gradient(90deg,rgba(154,92,255,.16),transparent);padding:10px 12px;margin-bottom:10px}

.ov{position:fixed;inset:0;z-index:20;background:rgba(2,4,12,.9);display:grid;place-items:center;padding:20px}
.ov .win{width:100%;max-width:420px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.big{font-size:44px;font-weight:800;color:#fff;text-shadow:0 0 12px var(--glow),0 0 40px var(--line);margin:6px 0}
.arise .big{text-shadow:0 0 12px var(--violet),0 0 40px #5a2bd0}
.arise.win{border-color:var(--violet);box-shadow:0 0 30px rgba(154,92,255,.5),inset 0 0 30px rgba(154,92,255,.2)}

@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes fl{from{opacity:.9}to{opacity:0}}
@keyframes gl{0%,92%,100%{transform:none}93%{transform:translate(-3px,1px);color:var(--glow)}95%{transform:translate(3px,-1px);color:var(--violet)}97%{transform:none}}
@media (prefers-reduced-motion:reduce){.ov .win,.flash,.glitch{animation:none}.bar i{transition:none}}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
#toast div{background:rgba(6,14,38,.96);border:1px solid var(--glow);padding:8px 12px;font-size:13px;box-shadow:0 0 14px rgba(77,163,255,.5)}
#toast .bad{border-color:var(--red);box-shadow:0 0 14px rgba(255,68,102,.4)}
label{display:block;text-align:left;font-size:12px;color:var(--dim);margin:10px 0 4px}
input,select{width:100%;background:#050c20;border:1px solid var(--line);color:var(--text);padding:9px;font:inherit;font-size:16px}
.seg{display:flex;gap:8px}.seg button{flex:1}
.seg button.sel{background:rgba(77,163,255,.4)}
.cd{font-size:12px}.opt{display:block;width:100%;margin-bottom:8px;text-align:left;padding:11px 14px}.opt.sel{background:rgba(77,163,255,.45);box-shadow:0 0 10px var(--glow)}
html{background:#04060d}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}textarea{width:100%;height:150px;background:#050c20;border:1px solid var(--line);color:var(--text);padding:9px;font:inherit;font-size:16px;resize:none}
.it{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:5px 0;text-align:left}.r0{color:#9aa7c7}.r1{color:#4da3ff}.r2{color:#b57cff}.r3{color:#ffc857}
</style>

<script>
var KEY='hunter-system-v1';
var STATS={STR:'體能',INT:'智力',VIT:'健康',SEN:'心靈',AGI:'效率'};
var S=null,tab='status',ovq=[],confirmId=null;
function z(n){return String(n).padStart(2,'0')}
function ds(d){d=d||new Date();return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
var T=ds(),Y=ds(new Date(Date.now()-864e5));
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function need(l){return 100+(l-1)*50}
function rankOf(l){return l>=30?'S':l>=20?'A':l>=15?'B':l>=10?'C':l>=5?'D':'E'}
function fresh(){return{name:'玩家',lv:1,xp:0,hp:100,day:T,stats:{STR:0,INT:0,VIT:0,SEN:0,AGI:0},habits:[],rewards:[]}}
function load(){try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):fresh()}catch(e){S=fresh()}
 if(!S||!S.habits)S=fresh();
 if(S.init===undefined)S.init=S.habits.length>0;
 rollover();if(!S.init&&!S.habits.length)ovq.push({k:'quiz'})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function daysDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function rollover(){var L=[],hp=0,xp=0;S.gems=S.gems||0;S.pity=S.pity||0;S.dungeons=S.dungeons||[];
 S.habits.forEach(function(h){if(h.last&&h.last<Y){if(covered(h.last)){h.last=Y}else if(S.sage&&S.sage.lv>1&&h.streak>=3&&(!S.shieldAt||daysDiff(S.shieldAt,T)>=7)){S.shieldAt=T;h.last=Y;toast('[系統] 詠唱破棄：已保護「'+h.name+'」的連續天數')}else h.streak=0}
  if(S.hard&&h.type==='good'){var b=h.last||h.start||S.day;if(h.pen&&h.pen>b)b=h.pen;
   var m=Math.min(3,Math.max(0,daysDiff(b,Y)-sdCount(b,Y)));if(m>0){hp+=10*m;xp+=Math.ceil(h.xp/2)*m;L.push(h.name+'：漏做 '+m+' 天')}}
  h.pen=Y});
 if(S.day!==T){S.hp=Math.min(100,S.hp+10+eff().rg+(sk('s2')?5:0));poison()}
 dExpire();sageWarn();S.day=T;
 if(hp){S.hp-=hp;S.xp=Math.max(0,S.xp-xp);var nd=nearDeath();if(nd===1)L.push('不屈意志發動：免於瀕死，HP 回復至 30');else if(nd===2)L.push('瀕死：本級經驗歸零，HP 回復至 50');ovq.push({k:'pen',L:L,hp:hp,xp:xp})}
 save()}
function tick(){if(ds()!==T){T=ds();Y=ds(new Date(Date.now()-864e5));rollover();render();flush();return}updateCd()}
function nOpen(){return S.habits.filter(function(h){return !done(h)&&h.type==='good'}).length}
function updateCd(){var n=new Date(),e=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.floor((e-n)/1000),t=z(Math.floor(s/3600))+':'+z(Math.floor(s%3600/60))+':'+z(s%60),op=nOpen();
 document.querySelectorAll('.cd').forEach(function(x){x.textContent='距離截止 '+t;x.style.color=(s<10800&&op)?'var(--red)':'var(--glow)'})}
function cdBox(){return'<div class="win"><div class="ttl"><span>[ 今日截止 ]</span><span class="cd"></span></div><div class="sub" style="margin:0">尚有 '+nOpen()+' 項好習慣未完成。'+(S.hard?'困難模式：漏做會自動扣 HP 與 XP。':'午夜過後未完成，連續天數會中斷。')+'</div></div>'}
function modeBox(){return'<div class="win"><div class="ttl"><span>[ 難度模式 ]</span></div><div class="sub" style="margin:0 0 8px">'+(S.hard?'困難模式：好習慣每漏做一天，自動扣 10 HP 與該任務一半 XP（一次最多結算 3 天）。':'一般模式：漏做只會中斷連續天數。')+'</div><div class="btns"><button class="b '+(S.hard?'r':'')+'" onclick="toggleHard()">切換為'+(S.hard?'一般':'困難')+'模式</button><button class="b" onclick="startQuiz()">重新做覺醒測驗</button></div><div class="btns"><button class="b" onclick="exportData()">匯出備份</button><button class="b" onclick="importData()">匯入備份</button></div></div>'}
function toggleHard(){S.hard=!S.hard;S.habits.forEach(function(h){h.pen=Y});save();render();toast('[系統] 已切換為'+(S.hard?'困難':'一般')+'模式',S.hard)}
var QS=[{q:'你的作息比較接近？',o:['早起型（早睡早起）','夜貓型（晚睡晚起）']},{q:'最想提升哪些領域？（最多選 2 項）',m:1,o:['體能','智力','健康','心靈','效率']},{q:'每天最多能投入多少時間？',o:['15 分鐘','30 分鐘','60 分鐘以上']},{q:'想戒除哪一個壞習慣？',o:['滑短影音','熬夜','含糖飲料','暫時不設']},{q:'選擇難度模式',o:['一般模式（漏做只中斷連續）','困難模式（漏做自動受罰）']}];
var QZ=null;
function startQuiz(){QZ={i:0,a:[],sel:[]};qz()}
function qz(){var q=QS[QZ.i];$('#ov').innerHTML='<div class="ov"><div class="win" style="max-height:92vh;overflow:auto"><div class="ttl"><span>[ 覺醒測驗 '+(QZ.i+1)+'／'+QS.length+' ]</span></div><div style="font-weight:700;margin-bottom:10px;text-align:left">'+q.q+'</div>'+q.o.map(function(t,k){return'<button class="b opt'+(QZ.sel.indexOf(k)>-1?' sel':'')+'" onclick="pick('+k+')">'+t+'</button>'}).join('')+(q.m?'<div class="btns" style="justify-content:center"><button class="b g" onclick="nextQ()">下一題</button></div>':'')+'<div class="btns" style="justify-content:center"><button class="b x" style="margin-left:0" onclick="skipQ()">略過測驗</button></div></div></div>'}
function pick(k){var q=QS[QZ.i];if(q.m){var p=QZ.sel.indexOf(k);if(p>-1)QZ.sel.splice(p,1);else if(QZ.sel.length<2)QZ.sel.push(k);qz()}else{QZ.a.push([k]);QZ.i++;QZ.sel=[];if(QZ.i<QS.length)qz();else finishQ()}}
function nextQ(){if(!QZ.sel.length){toast('請至少選 1 項',true);return}QZ.a.push(QZ.sel.slice());QZ.i++;QZ.sel=[];if(QZ.i<QS.length)qz();else finishQ()}
function skipQ(){S.init=true;save();closeOv()}
function finishQ(){var a=QZ.a,ST=['STR','INT','VIT','SEN','AGI'],foc=a[1].map(function(k){return ST[k]}),i3=a[2][0],m=[10,20,30][i3],cnt=[3,4,5][i3],xp=[10,20,30][i3],early=a[0][0]===0,
 order=foc.concat(['VIT','STR','INT','SEN','AGI'].filter(function(k){return foc.indexOf(k)<0})).slice(0,cnt),
 NM={STR:'運動 '+m+' 分鐘',INT:'閱讀 '+m+' 分鐘',VIT:early?'早起（7:00 前起床）':'早睡（00:00 前就寢）',SEN:'冥想 10 分鐘',AGI:'整理今日待辦'},
 bad=[['不滑短影音','SEN'],['不熬夜','VIT'],['不喝含糖飲料','VIT']][a[3][0]],list=[],t=Date.now(),names=[];
 order.forEach(function(k,j){list.push({id:'h'+t+j,name:NM[k],type:'good',stat:k,xp:xp,goal:(k==='SEN'||k==='AGI')?14:21})});
 if(bad)list.push({id:'h'+t+'b',name:bad[0],type:'bad',stat:bad[1],xp:20,goal:14});
 list.forEach(function(h){if(S.habits.some(function(x){return x.name===h.name}))return;h.streak=0;h.total=0;h.last=null;h.shadow=false;h.start=T;h.pen=Y;S.habits.push(h);names.push(h.name)});
 foc.forEach(function(k){S.stats[k]+=2});S.hard=a[4][0]===1;S.init=true;save();
 $('#ov').innerHTML='<div class="ov"><div class="win"><div class="ttl" style="justify-content:center">[ 覺醒完成 ]</div><div class="big" style="font-size:30px">任務已生成</div><div style="text-align:left;font-size:14px">'+(names.length?names.map(function(t){return'<div>'+esc(t)+'</div>'}).join(''):'沒有新增任務（已有同名任務）')+'</div><div class="sub">所選領域能力值 +2　'+(S.hard?'困難模式':'一般模式')+'</div><div class="btns" style="justify-content:center"><button class="b" onclick="closeOv()">開始</button></div></div></div>'}
function exportData(){var j=JSON.stringify(S);$('#ov').innerHTML='<div class="ov"><div class="win"><div class="ttl">[ 匯出備份 ]</div><div class="sub" style="margin:0 0 8px;text-align:left">複製這段文字，貼到備忘錄或傳給自己保存。換裝置或重裝時用「匯入備份」還原。</div><textarea id="bk" readonly>'+esc(j)+'</textarea><div class="btns" style="justify-content:center"><button class="b" onclick="copyBk()">複製</button><button class="b" id="shb" onclick="shareBk()">分享</button><button class="b x" style="margin-left:0" onclick="closeOv()">關閉</button></div></div></div>';if(!navigator.share)$('#shb').style.display='none'}
function copyBk(){var t=$('#bk');t.focus();t.select();t.setSelectionRange(0,t.value.length);var ok=false;try{ok=document.execCommand('copy')}catch(e){}
 if(navigator.clipboard&&!ok){navigator.clipboard.writeText(t.value).then(function(){toast('[系統] 已複製備份')},function(){toast('請長按文字手動複製',true)});return}
 toast(ok?'[系統] 已複製備份':'請長按文字手動複製',!ok)}
function shareBk(){try{navigator.share({title:'獵人系統備份',text:$('#bk').value})}catch(e){}}
function importData(){$('#ov').innerHTML='<div class="ov"><div class="win"><div class="ttl">[ 匯入備份 ]</div><div class="sub" style="margin:0 0 8px;text-align:left">貼上先前匯出的備份文字。匯入會覆蓋目前的所有進度。</div><textarea id="bk" placeholder="貼上備份文字"></textarea><div class="btns" style="justify-content:center"><button class="b r" onclick="doImport()">匯入並覆蓋</button><button class="b x" style="margin-left:0" onclick="closeOv()">取消</button></div></div></div>'}
function doImport(){var o;try{o=JSON.parse($('#bk').value.trim())}catch(e){toast('格式不正確，請完整貼上備份文字',true);return}
 if(!o||!Array.isArray(o.habits)||!o.stats||typeof o.lv!=='number'){toast('這不是有效的備份',true);return}
 S=o;S.init=true;rollover();save();closeOv();toast('[系統] 備份已還原')}
var RK=['E','D','C','B','A','S'],RN=['普通','稀有','史詩','傳說'],RP=[1,2,4,8],LP=[.02,.04,.07,.12],KD=['武器','防具','飾品'];
var EQN=[['鐵匕首','獵人長劍','影之短刃','君王雙刃'],['皮甲','鎖子甲','暗影披風','君王鎧甲'],['銅戒','魔力吊墜','影子戒指','君王之冠']];
var SK={s1:['魂晶感應','完成任務時額外 +1 魂晶',1],s2:['再生','每日 HP 回復 +5',1],s3:['鐵壁','破戒時 HP 損失 −5',1],s4:['君王威壓','XP 加成 +5%',2],s5:['壓制','副本傷害 +20%',2],s6:['暗影支配','暗影收編機率 +20%',3]};
var MON=[['哥布林兵','巨鼠','盜賊'],['狼人','獸人戰士','叛逃獵人'],['石像鬼','暗夜刺客','巨魔'],['冰熊','騎士團長','蜥蜴戰神'],['龍騎士','巨人王','暗影法師'],['古龍','冰之君主','將軍級獵人']];
var W=[[70,25,5,0],[60,30,9,1],[45,38,15,2],[30,42,22,6],[20,40,30,10],[10,35,38,17]];
function sk(i){return S.skills&&S.skills.indexOf(i)>-1}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function pickR(w){var t=w.reduce(function(a,b){return a+b},0),x=Math.random()*t;for(var i=0;i<w.length;i++){x-=w[i];if(x<0)return i}return 0}

  var g=H.filter(function(x){return x.type==='good'}),b=H.filter(function(x){return x.type==='bad'});
  if(g.length)h+='<div class="win"><div class="ttl">[ 每日任務 ]</div>'+g.map(card).join('')+'</div>';
  if(b.length)h+='<div class="win" style="border-color:#7a2442"><div class="ttl" style="color:var(--red)">[ 戒除目標：敵人 ]</div>'+b.map(card).join('')+'</div>'}
 if(tab==='army'){
  var sh=shadows();
  h+='<div class="win arise" style="border-color:var(--violet)"><div class="ttl" style="color:var(--violet)">[ 暗影軍團 ]</div><div class="sub" style="margin:0">你是君主，每個達成目標的習慣都是你的暗影士兵。人數越多，所有 XP 加成越高。目前 ×'+mult().toFixed(1)+'。</div></div>';
  if(!sh.length)h+='<div class="empty">尚無暗影。讓任何習慣連續達成目標天數，就能將它收編。</div>';
  sh.forEach(function(x){var r=sRank(x);h+='<div class="sh"><div class="em">'+r[0]+'</div><div style="flex:1"><div class="qn">'+esc(x.name)+'</div><div class="sub" style="margin:2px 0 0">'+r[1]+'　連續 '+x.streak+' 天　累計 '+x.total+' 次</div></div></div>'});
  var cand=H.filter(function(x){return !x.shadow}).sort(function(a,b){return b.streak/b.goal-a.streak/a.goal}).slice(0,3);
  if(cand.length){h+='<div class="win"><div class="ttl">[ 候補 ]</div>'+cand.map(function(x){return'<div style="margin-bottom:10px"><div class="row" style="margin:0 0 3px"><span style="color:var(--text)">'+esc(x.name)+'</span><span>還差 '+Math.max(0,x.goal-x.streak)+' 天</span></div><div class="bar gd"><i style="width:'+Math.min(100,x.streak/x.goal*100)+'%"></i></div></div>'}).join('')+'</div>'}}
 if(tab==='shop'){
  h+='<div class="win"><div class="ttl">[ 設定獎勵 ]</div><label>獎勵內容</label><input id="rn" maxlength="30" placeholder="例如：一頓大餐"><label>達到等級</label><input id="rl" type="number" min="2" max="99" value="'+(S.lv+1)+'"><div class="btns"><button class="b" onclick="addR()">加入獎勵</button></div></div>';
  if(!S.rewards.length)h+='<div class="empty">替自己設定升級獎勵，等級到了就能領取。</div>';
  S.rewards.slice().sort(function(a,b){return a.lv-b.lv}).forEach(function(r){var ok=S.lv>=r.lv;
   h+='<div class="q" style="'+(r.claimed?'opacity:.5':'')+'"><div class="qh"><span class="qn">'+esc(r.name)+'</span><span class="tag">Lv.'+r.lv+'</span></div><div class="btns"><button class="b g" '+(!ok||r.claimed?'disabled':'')+' onclick="claim(\''+r.id+'\')">'+(r.claimed?'已領取':ok?'領取':'尚未解鎖')+'</button><button class="b x" onclick="delR(\''+r.id+'\')">刪除</button></div></div>'})}
 if(tab==='army')h+=legionView2();if(tab==='dun')h+=dunView();if(tab==='vault')h+=vaultView()+namedBox();$('#app').innerHTML=h;updateCd()}
function go(t){tab=t;confirmId=null;render();window.scrollTo(0,0)}
load();render();flush();setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
try{if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js')}catch(e){}
